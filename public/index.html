<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Invoice from Chat | Arabbika</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <h1>Arabbika Invoices</h1>
      <p>Paste a client conversation. Get a payable invoice in 30 seconds.</p>
    </header>

    <div class="settings-box">
      <h3>Your Business Details</h3>
      <div class="settings-grid">
        <input type="text" id="biz-name" placeholder="Business Name" oninput="saveSettings()">
        <input type="text" id="biz-email" placeholder="Business Email" oninput="saveSettings()">
        <input type="text" id="biz-logo" placeholder="Logo URL (Optional)" oninput="saveSettings()">
      </div>
    </div>

    <section id="input-section">
      <textarea id="chat" placeholder="Paste your WhatsApp, Slack, or email conversation here..."></textarea>
      <button id="generate-btn">Generate Invoice</button>
      <div id="error" class="error"></div>
    </section>

    <!-- Editable Preview Section -->
    <section id="result-section" style="display:none">
      <h2>Review & Send</h2>
      <p style="font-size: 14px; color: #666; margin-bottom: 16px;">AI can make mistakes. Please verify the details before sending.</p>
      
      <div class="invoice-card">
        <div class="input-group">
          <label>Client Name</label>
          <input type="text" id="edit-client-name">
        </div>
        <div class="input-group">
          <label>Client Email</label>
          <input type="email" id="edit-client-email" required placeholder="Required for payment link">
        </div>
        
        <h3 style="margin-top: 20px; font-size: 14px;">Line Items</h3>
        <div id="edit-items-container"></div>
        <button onclick="addItem()" style="background: transparent; color: #635bff; border: 1px solid #635bff; padding: 8px; font-size: 12px;">+ Add Item</button>

        <div style="margin-top: 20px; text-align: right;">
          <strong>Total: <span id="edit-total">0.00</span> ZAR</strong>
        </div>
      </div>

      <div class="actions">
        <button id="save-and-link-btn">Save & Create Payment Link</button>
        <a id="view-invoice-btn" target="_blank">View Public Invoice →</a>
      </div>
      <div id="payment-result"></div>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
